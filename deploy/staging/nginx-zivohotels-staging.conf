# ZivoHotels STAGING — Nginx site (one domain: website + API).
# Install as /etc/nginx/sites-available/zivohotels-staging and enable with a symlink in
# sites-enabled. It only answers for its own server_name, so other sites on this server
# are not affected. Certbot adds the HTTPS (443) block and the http->https redirect.
#
# Change these 3 things if yours differ:
#   server_name  staging.zivohotels.com
#   root         /var/www/zivohotels-staging/app/dist
#   127.0.0.1:5100  (must match PORT in backend/.env)

server {
    listen 80;
    listen [::]:80;
    server_name staging.zivohotels.com;

    root /var/www/zivohotels-staging/app/dist;
    index index.html;

    # Staging must never show up in search engines
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Photos and KYC documents are uploaded as base64 inside JSON (up to ~15 MB)
    client_max_body_size 20m;

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Live updates (Socket.io: long-polling + WebSocket upgrade)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Public hotel photos (served by the backend from backend/public/uploads).
    # KYC documents are NOT here: they live in backend/private_uploads and are only
    # served through the logged-in API.
    location /uploads/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host $host;
    }

    # Health checks
    location = /health { proxy_pass http://127.0.0.1:5100; }
    location = /ready  { proxy_pass http://127.0.0.1:5100; }

    # Built frontend files have hashed names: cache them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Single-page app: every other path loads index.html (React Router)
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }
}
