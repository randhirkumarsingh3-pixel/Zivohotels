# ZivoPlus app on the VPS: a separate Docker Compose project ("zivoplus-app").
# Its own database, API, website, networks and volumes; nothing is shared with any other
# project. The server's existing Caddy reaches our website through OUR network
# "zivoplus-app-edge": caddy-link.sh attaches the Caddy container to it. Nothing of ours
# joins the other project's network, so its deploys (including `docker compose down`) are
# never blocked by us.
#
# Settings: deploy/vps/.env (copy from .env.example). Run everything via deploy.sh.
name: zivoplus-app

# Container output is kept on disk and rotated: 10 files of 20 MB per container
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "10"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    # Sized for a VPS shared with another project (about 31 GB RAM): room for every server process's
    # connections (WEB_CONCURRENCY x DB_POOL_PER_PROCESS), 1 GB cache, SSD-friendly planning
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=1000
    shm_size: 1gb
    environment:
      POSTGRES_DB: zivoplus
      POSTGRES_USER: zivoplus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/vps/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zivoplus -d zivoplus"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # Shared memory for the server processes: rate limits, live updates, blocked IPs
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  api:
    build:
      context: ../../backend
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5100"
      # Caddy -> web container -> API: two proxies, so rate limits see the real visitor IP
      TRUST_PROXY: ${TRUST_PROXY:-2}
      # true once Cloudflare's proxy (orange cloud) is on for APP_DOMAIN (see CLOUDFLARE.md)
      BEHIND_CLOUDFLARE: ${BEHIND_CLOUDFLARE:-false}
      STORAGE_DRIVER: local
      # Server processes (one per CPU core used); they share state through Redis
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://zivoplus:${DB_PASSWORD}@db:5432/zivoplus?connection_limit=${DB_POOL_PER_PROCESS:-10}
      DIRECT_URL: postgresql://zivoplus:${DB_PASSWORD}@db:5432/zivoplus
      CORS_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN in deploy/vps/.env}
      FRONTEND_URL: https://${APP_DOMAIN}
      # Search engines: keep false on staging (test data); true only on the live site
      ALLOW_INDEXING: ${ALLOW_INDEXING:-false}
      # The built website page that SEO pages are filled into (served by the website container)
      SEO_TEMPLATE_URL: http://zivoplus-app-web/index.html
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/vps/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?Set RAZORPAY_KEY_ID in deploy/vps/.env}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?Set RAZORPAY_KEY_SECRET in deploy/vps/.env}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-ZivoPlus <noreply@zivoplus.com>}
      # Sign-in codes shown on screen instead of emailed ("true" only until the Resend domain works)
      EMAIL_TEST_MODE: ${EMAIL_TEST_MODE:-false}
      # Admin alert emails (refund failed, property submitted), comma-separated
      ADMIN_ALERT_EMAILS: ${ADMIN_ALERT_EMAILS:-}
      # SMS: test (codes shown on screen) until msg91 or twilio is connected
      SMS_PROVIDER: ${SMS_PROVIDER:-test}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_OTP_TEMPLATE_ID: ${MSG91_OTP_TEMPLATE_ID:-}
      MSG91_SMS_TEMPLATE_ID: ${MSG91_SMS_TEMPLATE_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      # "Continue with Google" appears once this is set (Google Cloud OAuth web client id)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Company details on invoices and vouchers (the company's own, printed on every invoice), and
      # the support contacts used until they are changed in Admin → Platform Settings → Support.
      # A value in .env overrides these.
      ZIVO_LEGAL_NAME: ${ZIVO_LEGAL_NAME:-ZIVO TECHNOLOGIES SOLUTIONS PRIVATE LIMITED}
      ZIVO_GSTIN: ${ZIVO_GSTIN:-10AADCZ1700C1Z8}
      ZIVO_GST_STATE_CODE: ${ZIVO_GST_STATE_CODE:-}
      ZIVO_PAN: ${ZIVO_PAN:-AADCZ1700C}
      ZIVO_CIN: ${ZIVO_CIN:-U62099BR2026PTC087845}
      ZIVO_TAN: ${ZIVO_TAN:-JBPZ00294A}
      ZIVO_ADDRESS: ${ZIVO_ADDRESS:-Makundpur Karpuri Gram, Karpoorigram, Samastipur 848129, Bihar, India}
      ZIVO_SUPPORT_EMAIL: ${ZIVO_SUPPORT_EMAIL:-support@zivoplus.com}
      ZIVO_SUPPORT_PHONE: ${ZIVO_SUPPORT_PHONE:-9663035520}
      # Encryption at rest for bank details and KYC documents (created once by deploy.sh; keep a copy off the server)
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in deploy/vps/.env (deploy.sh creates it)}
      # App logs on disk (rotated by size, old files removed after 90 days), kept across redeploys
      LOG_DIR: /app/logs
    volumes:
      - logs:/app/logs                         # app request and error logs
      - uploads:/app/public/uploads            # hotel photos (public)
      - private-uploads:/app/private_uploads   # KYC documents (private)
      - invoices:/app/public/invoices          # guest invoice PDFs (served only via the API)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5100/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [internal]

  # Named uniquely: Caddy finds it by this name on the zivoplus-app-edge network.
  zivoplus-app-web:
    build:
      context: ../..
      dockerfile: deploy/vps/web.Dockerfile
      args:
        VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - edge

networks:
  internal: {}
  # Shared only with the Caddy container (attached by caddy-link.sh); only the website is on it
  edge:
    name: zivoplus-app-edge

volumes:
  db-data: {}
  redis-data: {}
  uploads: {}
  private-uploads: {}
  invoices: {}
  logs: {}
