# Security headers for the website's pages and files (included in every location below that
# serves them: Nginx drops server-level add_header in a location that has its own). API answers
# get theirs from the API (helmet); uploaded files get a sandbox policy from the API.

# HTTPS only, for two years, for every subdomain (and ready for the browsers' preload list)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
# No framing of our pages by other sites (clickjacking)
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Popups for Google sign-in and Razorpay keep working; other windows can't reach ours
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# Browser features the site doesn't use are off; location only for "Near me" on our own pages
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(self \"https://api.razorpay.com\"), usb=(), interest-cohort=()" always;
# What pages may load and run: our own code; Razorpay checkout; Google sign-in and Maps; the map
# library (pinned by hash); OpenStreetMap; photos over HTTPS. Nothing inline runs, no plugins, no
# framing, forms post only to us (and Razorpay). Breaks are reported to the API.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://*.razorpay.com https://accounts.google.com https://maps.googleapis.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com https://*.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss://$host https://*.razorpay.com https://accounts.google.com https://*.googleapis.com https://nominatim.openstreetmap.org; frame-src https://*.razorpay.com https://accounts.google.com https://www.openstreetmap.org; worker-src 'self' blob:; media-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://*.razorpay.com; frame-ancestors 'none'; upgrade-insecure-requests; report-uri /api/v1/security/csp-report" always;
# Pages filled by the API (home, hotel and city pages) carry the API's own versions of these:
# drop them so each header is sent once, with the values above
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
