# Inside the website container. Caddy (HTTPS) forwards everything for our domain here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Not a public production site yet: keep it out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Photos and KYC documents are uploaded as base64 inside JSON (up to ~15 MB)
    client_max_body_size 20m;

    # Pass the visitor's address and the original https scheme on to the API
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;

    location /api/      { proxy_pass http://api:5100; }
    location /uploads/  { proxy_pass http://api:5100; }   # public hotel photos (KYC files are never here)
    location = /health  { proxy_pass http://api:5100; }
    location = /ready   { proxy_pass http://api:5100; }

    # Live updates (Socket.io long-polling + WebSocket)
    location /socket.io/ {
        proxy_pass http://api:5100;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Built files have hashed names: cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Single-page app: any other path loads index.html
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }
}
