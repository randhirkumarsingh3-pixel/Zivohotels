# Inside the website container. Caddy (HTTPS) forwards everything for our domain here.

# Photos resized by the API (/img/w800/uploads/...) are kept here after the first request, so
# later visitors get them straight from Nginx without touching the API. Up to 5 GB, 30 days.
proxy_cache_path /var/cache/nginx/zivo-img levels=1:2 keys_zone=zivo_img:20m max_size=5g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Not a public production site yet: keep it out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Photos and KYC documents are uploaded as base64 inside JSON (up to ~15 MB)
    client_max_body_size 20m;

    # Compress text (pages, data, scripts, styles, SVG); photos are already compressed
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

    # Pass the visitor's address and the original https scheme on to the API
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;

    location /api/      { proxy_pass http://api:5100; }
    location /uploads/  { proxy_pass http://api:5100; }   # public hotel photos (KYC files are never here)

    # Photos at the size a page shows them (made once by the API, then served from Nginx's cache)
    location /img/ {
        proxy_pass http://api:5100;
        proxy_cache zivo_img;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /health  { proxy_pass http://api:5100; }
    location = /ready   { proxy_pass http://api:5100; }
    location = /robots.txt  { proxy_pass http://api:5100; }   # off unless ALLOW_INDEXING=true
    location = /sitemap.xml { proxy_pass http://api:5100; }

    # Live updates (Socket.io long-polling + WebSocket)
    location /socket.io/ {
        proxy_pass http://api:5100;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Built files have hashed names: cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Logo and icons: cache for a week (they rarely change)
    location /brand/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Single-page app: any other path loads index.html
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }
}
